<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Day to Night — Layered Motion Scene</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" aria-label="A designer working at a futuristic desk as the city changes from day to night">
    <svg class="scene" viewBox="0 0 1200 675" role="img" aria-labelledby="sceneTitle sceneDesc">
      <title id="sceneTitle">Day to night workspace</title>
      <desc id="sceneDesc">A person works at a desk while a futuristic city outside the window transitions from day to night.</desc>
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#42baff"/>
          <stop offset="1" stop-color="#b3e9ff"/>
        </linearGradient>
        <linearGradient id="roomGlow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#14204c"/>
          <stop offset="1" stop-color="#080b22"/>
        </linearGradient>
        <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#0a4667"/>
          <stop offset="1" stop-color="#10234f"/>
        </linearGradient>
        <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#58364f"/>
          <stop offset="1" stop-color="#241d3b"/>
        </linearGradient>
        <clipPath id="windowClip"><rect x="190" y="42" width="820" height="405" rx="70"/></clipPath>
        <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="7" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <!-- LAYER 01: ROOM BACKGROUND -->
      <g id="room-background">
        <rect width="1200" height="675" fill="#090d29"/>
        <rect x="0" y="0" width="1200" height="675" fill="url(#roomGlow)" opacity=".75"/>
        <path d="M0 0H1200V45H0Z" fill="#101638"/>
        <path d="M0 0V675H125V0ZM1075 0H1200V675H1075Z" fill="#101638"/>
        <rect x="30" y="34" width="115" height="150" rx="8" fill="#151c40"/>
        <rect x="48" y="52" width="80" height="66" rx="5" fill="#26345d"/>
        <circle cx="88" cy="85" r="17" fill="#070d25"/>
        <rect x="1080" y="40" width="82" height="118" rx="7" fill="#151c40"/>
        <path d="M1100 135L1124 60L1148 135" fill="none" stroke="#5b4775" stroke-width="8"/>
      </g>

      <!-- LAYER 02: WINDOW / SKY -->
      <g id="window-layer">
        <g clip-path="url(#windowClip)">
          <rect id="sky-fill" x="190" y="42" width="820" height="405" fill="url(#sky)"/>
          <circle id="sun" cx="330" cy="125" r="43" fill="#fff1a6" opacity=".95"/>
          <g id="moon" opacity="0">
            <circle cx="865" cy="112" r="34" fill="#e8f1ff"/>
            <circle cx="880" cy="100" r="31" fill="#17244d"/>
          </g>
          <g id="stars" opacity="0" fill="#eaf5ff">
            <circle cx="280" cy="100" r="2"/><circle cx="420" cy="78" r="2"/>
            <circle cx="535" cy="145" r="1.8"/><circle cx="690" cy="88" r="2"/>
            <circle cx="780" cy="165" r="1.6"/><circle cx="950" cy="82" r="2"/>
            <circle cx="915" cy="210" r="1.5"/><circle cx="365" cy="205" r="1.5"/>
          </g>
          <!-- LAYER 03: CLOUDS -->
          <g id="clouds" fill="#f4fbff" opacity=".88">
            <g class="cloud cloud-a"><ellipse cx="425" cy="115" rx="44" ry="14"/><ellipse cx="450" cy="104" rx="27" ry="20"/><ellipse cx="475" cy="116" rx="35" ry="13"/></g>
            <g class="cloud cloud-b"><ellipse cx="700" cy="175" rx="38" ry="12"/><ellipse cx="724" cy="165" rx="24" ry="17"/><ellipse cx="748" cy="176" rx="34" ry="12"/></g>
            <g class="cloud cloud-c"><ellipse cx="850" cy="70" rx="34" ry="10"/><ellipse cx="870" cy="62" rx="22" ry="15"/><ellipse cx="892" cy="72" rx="30" ry="10"/></g>
          </g>

          <!-- LAYER 04: DISTANT SKYLINE -->
          <g id="distant-city" fill="#4d85b6">
            <path d="M190 300V220H238V180H268V300ZM280 300V145H322V300ZM335 300V205H372V170H402V300ZM830 300V180H872V140H910V300ZM920 300V205H962V170H1010V300Z"/>
            <path d="M215 220H227V300H215ZM296 166H307V300H296ZM355 220H366V300H355ZM850 200H862V300H850ZM944 220H955V300H944Z" fill="#a9d9f0" opacity=".7"/>
          </g>

          <!-- LAYER 05: FOREGROUND BUILDINGS -->
          <g id="city-buildings">
            <path class="building" d="M190 447V195L260 165L305 195V447Z" fill="#176b9b"/>
            <path class="building" d="M305 447V235L365 205L412 230V447Z" fill="#207eae"/>
            <path class="building" d="M410 447V175L462 148L515 175V447Z" fill="#2879a7"/>
            <path class="building" d="M515 447V250L575 220L630 250V447Z" fill="#17628e"/>
            <path class="building" d="M630 447V190L695 155L755 190V447Z" fill="#1b6b9b"/>
            <path class="building" d="M755 447V225L815 190L870 225V447Z" fill="#267eaa"/>
            <path class="building" d="M870 447V165L925 135L1010 180V447Z" fill="#155d8b"/>
            <g id="building-windows" fill="#b6e9ff" opacity=".8">
              <path d="M207 220h12v18h-12zm25-12h12v18h-12zm25 18h12v18h-12zm-50 48h12v18h-12zm25-10h12v18h-12zm25 35h12v18h-12z"/>
              <path d="M326 260h12v18h-12zm25-15h12v18h-12zm25 35h12v18h-12zm-50 45h12v18h-12zm25-12h12v18h-12z"/>
              <path d="M432 205h13v19h-13zm27-18h13v19h-13zm27 25h13v19h-13zm-54 45h13v19h-13zm27-10h13v19h-13zm27 42h13v19h-13z"/>
              <path d="M650 220h13v19h-13zm28-18h13v19h-13zm28 28h13v19h-13zm-56 42h13v19h-13zm28-8h13v19h-13zm28 39h13v19h-13z"/>
              <path d="M890 205h13v19h-13zm28-20h13v19h-13zm28 30h13v19h-13zm-56 45h13v19h-13zm28-9h13v19h-13zm28 42h13v19h-13z"/>
            </g>
            <g id="night-windows" fill="#7ffaff" opacity="0">
              <path d="M207 220h12v18h-12zm25-12h12v18h-12zm25 18h12v18h-12zm-50 48h12v18h-12zm25-10h12v18h-12zm25 35h12v18h-12z"/>
              <path d="M326 260h12v18h-12zm25-15h12v18h-12zm25 35h12v18h-12zm-50 45h12v18h-12zm25-12h12v18h-12z"/>
              <path d="M432 205h13v19h-13zm27-18h13v19h-13zm27 25h13v19h-13zm-54 45h13v19h-13zm27-10h13v19h-13zm27 42h13v19h-13z"/>
              <path d="M650 220h13v19h-13zm28-18h13v19h-13zm28 28h13v19h-13zm-56 42h13v19h-13zm28-8h13v19h-13zm28 39h13v19h-13z"/>
              <path d="M890 205h13v19h-13zm28-20h13v19h-13zm28 30h13v19h-13zm-56 45h13v19h-13zm28-9h13v19h-13zm28 42h13v19h-13z"/>
            </g>
          </g>

          <!-- LAYER 06: BILLBOARDS -->
          <g id="billboards">
            <rect x="215" y="250" width="118" height="48" rx="5" fill="#ed4f7c"/>
            <text x="228" y="280" font-size="21" font-family="Arial,sans-serif" font-weight="bold" fill="#fff">NOVA</text>
            <rect x="810" y="250" width="125" height="55" rx="5" fill="#5b4bca"/>
            <text x="824" y="284" font-size="19" font-family="Arial,sans-serif" font-weight="bold" fill="#fff">FUTURE</text>
            <rect x="545" y="310" width="92" height="38" rx="5" fill="#ed8a4d"/>
            <text x="558" y="335" font-size="17" font-family="Arial,sans-serif" font-weight="bold" fill="#fff">SYN</text>
          </g>

          <!-- LAYER 07: WIND TURBINE + FLYING VEHICLES -->
          <g id="wind-turbine" stroke="#e9faff" stroke-width="4" stroke-linecap="round" opacity=".8">
            <path d="M575 360V210"/>
            <g class="turbine-blades" transform="translate(575 210)">
              <path d="M0 0L-8 -75M0 0L67 35M0 0L-60 42"/>
              <circle r="6" fill="#e9faff"/>
            </g>
          </g>
          <g id="flying-vehicles" fill="#152e61">
            <g class="vehicle vehicle-a"><path d="M0 0l26 -7 17 7 -17 7z"/><path d="M12 -5l8 -8 8 8z" fill="#7deeff"/></g>
            <g class="vehicle vehicle-b"><path d="M0 0l20 -5 14 5 -14 5z"/><path d="M9 -4l7 -7 7 7z" fill="#ff8ee7"/></g>
          </g>
          <g id="vehicle-trails" fill="none" stroke="#9bf7ff" stroke-width="2" opacity="0">
            <path d="M730 230q40 -12 75 0"/><path d="M360 330q32 -9 60 0"/>
          </g>
          <!-- LAYER 08: CITY HAZE -->
          <rect id="city-haze" x="190" y="350" width="820" height="97" fill="#d4f2ff" opacity=".12"/>
        </g>
        <!-- Window frame -->
        <rect x="175" y="27" width="850" height="435" rx="82" fill="none" stroke="#05091e" stroke-width="28"/>
        <path d="M200 60H1000" stroke="#b9dfff" stroke-width="3" opacity=".25"/>
      </g>

      <!-- LAYER 09: ROOM PLANTS -->
      <g id="plants">
        <path d="M105 450q-30 -65 -8 -95q30 28 8 95M105 450q-5 -70 28 -92q14 38 -28 92M105 450q-50 -45 -43 -73q35 8 43 73" fill="#247b68"/>
        <path d="M1090 452q-35 -72 -8 -108q34 35 8 108M1090 452q-3 -75 38 -98q11 44 -38 98M1090 452q-48 -48 -42 -80q38 12 42 80" fill="#267e70"/>
        <path d="M76 450h65l-8 38H84Z" fill="#573d52"/>
        <path d="M1062 450h62l-8 38h-46Z" fill="#573d52"/>
      </g>

      <!-- LAYER 10: DESK -->
      <g id="desk">
        <path d="M75 475H1125L1095 545H105Z" fill="url(#deskTop)"/>
        <path d="M105 545H1095V675H105Z" fill="#11152f"/>
        <path d="M120 545H1080" stroke="#ff78c8" stroke-width="4" opacity=".4"/>
        <rect x="190" y="492" width="130" height="28" rx="8" fill="#20284b"/>
        <rect x="205" y="499" width="70" height="5" rx="2" fill="#48d9ff"/>
        <rect x="205" y="509" width="95" height="4" rx="2" fill="#6c6fbd"/>
        <rect x="870" y="490" width="90" height="32" rx="8" fill="#24284d"/>
        <path d="M890 505h48" stroke="#53eaff" stroke-width="3" opacity=".7"/>
        <ellipse cx="600" cy="538" rx="240" ry="12" fill="#060a20" opacity=".5"/>
      </g>

      <!-- LAYER 11: MONITORS / DASHBOARDS -->
      <g id="monitors">
        <rect x="360" y="345" width="235" height="145" rx="12" fill="#070d24" stroke="#34416d" stroke-width="8"/>
        <rect x="373" y="358" width="209" height="118" rx="5" fill="url(#screenGlow)"/>
        <rect x="610" y="330" width="225" height="160" rx="12" fill="#070d24" stroke="#34416d" stroke-width="8"/>
        <rect x="623" y="343" width="199" height="133" rx="5" fill="url(#screenGlow)"/>
        <g id="dashboard-ui" fill="none" stroke-linecap="round">
          <path d="M390 382h95M390 396h65M390 410h78M390 440h75" stroke="#54dfff" stroke-width="5" opacity=".8"/>
          <path d="M642 380h150M642 395h120" stroke="#54dfff" stroke-width="4" opacity=".8"/>
          <path d="M644 448l28 -18 23 9 29 -34 25 15 30 -28" stroke="#a6fffb" stroke-width="4"/>
          <circle cx="770" cy="390" r="23" stroke="#f06de2" stroke-width="7"/>
          <circle cx="770" cy="390" r="10" stroke="#4deaff" stroke-width="7"/>
          <path d="M644 462h145" stroke="#8c8fff" stroke-width="3"/>
        </g>
        <path d="M468 490v18m-42 0h84M722 490v18m-42 0h84" stroke="#323b67" stroke-width="9" stroke-linecap="round"/>
        <rect x="515" y="508" width="170" height="9" rx="4" fill="#30375c"/>
      </g>

      <!-- LAYER 12: GIRL / CHARACTER -->
      <g id="character">
        <!-- chair -->
        <path d="M470 555q0 -70 130 -70t130 70v120H470Z" fill="#171b3b"/>
        <path d="M490 575q110 -38 220 0" fill="none" stroke="#343c6b" stroke-width="12" opacity=".6"/>
        <!-- torso -->
        <path d="M495 475q15 -35 54 -42h102q40 8 55 42l26 95H465Z" fill="#11152f"/>
        <path d="M510 468q-18 44 -20 91" stroke="#252c54" stroke-width="15" fill="none"/>
        <path d="M690 468q18 44 20 91" stroke="#252c54" stroke-width="15" fill="none"/>
        <!-- neck and head -->
        <path d="M568 404h64v62q-32 28 -64 0Z" fill="#9b5c58"/>
        <path d="M548 345q5 -70 54 -70t55 70v65q-8 44 -55 47q-48 -3 -54 -47Z" fill="#090d25"/>
        <path d="M548 360q-15 35 -2 69q8 18 23 23l-5 -62M657 360q15 35 2 69q-8 18 -23 23l5 -62" fill="#090d25"/>
        <path d="M557 342q20 -40 68 -22" stroke="#26315d" stroke-width="8" fill="none" opacity=".5"/>
        <!-- arms -->
        <path id="left-arm" d="M500 470q-34 25 -42 67l30 12q22 -33 48 -53" fill="#9b5c58"/>
        <path id="right-arm" d="M700 470q34 25 42 67l-30 12q-22 -33 -48 -53" fill="#9b5c58"/>
      </g>

      <!-- LAYER 13: FOREGROUND NEON / REFLECTION -->
      <g id="neon-reflections" opacity="0">
        <path d="M180 478H1020" stroke="#13eaff" stroke-width="5" filter="url(#softGlow)" opacity=".65"/>
        <path d="M300 530q300 35 600 0" stroke="#bd4dff" stroke-width="8" fill="none" filter="url(#softGlow)" opacity=".5"/>
        <ellipse cx="600" cy="470" rx="280" ry="25" fill="#5e3cff" opacity=".12"/>
      </g>
      <rect id="night-overlay" x="190" y="42" width="820" height="405" rx="70" fill="#080c31" opacity="0"/>
    </svg>
  </main>
  <div class="controls">
    <button id="playPause" type="button">Pause animation</button>
    <label for="timeScrubber">Time of day</label>
    <input id="timeScrubber" type="range" min="0" max="100" value="0">
    <output id="timeLabel">Day</output>
  </div>
  <script src="script.js"></script>
</body>
</html>
